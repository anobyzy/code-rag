# Postgres + pgvector, ISOLATED, for the code index (code_rag).
# Engineering database for source code. Publish only on IPv4 loopback.
name: ${CODE_RAG_COMPOSE_PROJECT:-code-rag}

services:
  code-rag-db:
    image: pgvector/pgvector:pg16
    container_name: ${CODE_RAG_COMPOSE_PROJECT:-code-rag}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: code_rag
      POSTGRES_PASSWORD: ${CODE_RAG_POSTGRES_PASSWORD:?Set CODE_RAG_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: code_rag
    ports:
      - "127.0.0.1:${CODE_RAG_PORT:-5433}:5432"
    volumes:
      - code_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_rag -d code_rag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  code_rag_pgdata:
