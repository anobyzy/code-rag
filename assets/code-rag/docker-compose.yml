# Postgres + pgvector, ISOLATED, for the code index (code_rag).
# Engineering database: holds NO tenant/product data — weak creds are fine here
# (localhost, no PII). NEVER point this at, or reuse it for, product data.
# Default host port 5433; change it (and .env) if that port is taken.
name: code-rag

services:
  code-rag-db:
    image: pgvector/pgvector:pg16
    container_name: code-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: code_rag
      POSTGRES_PASSWORD: code_rag
      POSTGRES_DB: code_rag
    ports:
      - "5433:5432"
    volumes:
      - code_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_rag -d code_rag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  code_rag_pgdata:
